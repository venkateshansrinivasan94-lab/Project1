<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Hello, World!</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@400;500;600;700;800&display=swap');

      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #101827;
        color: #f8fafc;
        font-family: Outfit, Arial, sans-serif;
      }
      nav { position: fixed; z-index: 2; top: 1.4rem; right: max(5vw, 1.5rem); display: flex; gap: 1.1rem; }
      nav a { color: #cbd5e1; font-size: .95rem; font-weight: 600; text-decoration: none; transition: color .2s; }
      nav a:hover, nav a[aria-current="page"] { color: #fff; }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(18px);
        opacity: .7;
        pointer-events: none;
      }
      .glow-one { width: 36rem; height: 36rem; background: #7c3aed; top: -18rem; left: -12rem; }
      .glow-two { width: 30rem; height: 30rem; background: #0891b2; bottom: -16rem; right: -10rem; }
      .card {
        position: relative;
        width: min(90vw, 720px);
        padding: clamp(2rem, 7vw, 4.8rem);
        border: 1px solid rgba(255,255,255,.17);
        border-radius: 30px;
        background: rgba(17, 24, 39, .7);
        box-shadow: 0 30px 80px rgba(0,0,0,.35);
        backdrop-filter: blur(20px);
        text-align: center;
        animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
      }
      .eyebrow {
        margin: 0 0 1.25rem;
        color: #a5f3fc;
        font: 14px "DM Mono", monospace;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(3.1rem, 10vw, 6.6rem);
        line-height: .94;
        letter-spacing: -.065em;
      }
      h1 span {
        background: linear-gradient(120deg, #fff 15%, #c4b5fd 52%, #67e8f9 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .copy { margin: 1.6rem auto 2.2rem; max-width: 30rem; color: #cbd5e1; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.6; }
      .button {
        display: inline-flex;
        gap: .55rem;
        align-items: center;
        padding: .85rem 1.15rem;
        border: 0;
        border-radius: 999px;
        color: #111827;
        background: #f8fafc;
        font: 600 1rem Outfit, sans-serif;
        cursor: pointer;
        box-shadow: 0 10px 26px rgba(165,243,252,.16);
        transition: transform .2s, box-shadow .2s;
      }
      .button:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(165,243,252,.28); }
      .button:active { transform: translateY(0); }
      .status { min-height: 1.2em; margin: 1rem 0 0; color: #a5f3fc; font: 12px "DM Mono", monospace; }
      .spark { color: #8b5cf6; font-size: 1.3em; }
      @keyframes arrive { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @media (prefers-reduced-motion: reduce) { .card { animation: none; } .button { transition: none; } }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation"><a href="index.html" aria-current="page">Home</a><a href="about.html">About</a><a href="content.html">Content</a></nav>
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <main class="card">
      <p class="eyebrow">A small beginning <span class="spark">✦</span></p>
      <h1>Hello, <span>World!</span></h1>
      <p class="copy">One simple message, dressed for the occasion. Your next great idea can start right here.</p>
      <button class="button" type="button" id="greet">Say hello <span aria-hidden="true">→</span></button>
      <p class="status" id="status" aria-live="polite"></p>
    </main>
    <script>
      document.getElementById('greet').addEventListener('click', () => {
        document.getElementById('status').textContent = 'Hello right back at you!';
      });
    </script>
  </body>
</html>
